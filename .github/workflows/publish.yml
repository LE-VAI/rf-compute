name: publish

# Publishes rf-compute to PyPI with trusted publishing (OIDC): no API token
# is stored anywhere. PyPI must list this repository as a trusted publisher
# (owner LE-VAI, repository rf-compute, workflow publish.yml, environment
# pypi). Run it by hand against a release tag:
#   gh workflow run publish.yml --ref v0.1.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test the built wheel (not the checkout)
        run: |
          python -m pip install dist/*.whl pytest
          mkdir -p /tmp/wheeltest && cp -r tests README.md /tmp/wheeltest/
          cd /tmp/wheeltest
          python -c "import rf_compute; assert 'site-packages' in rf_compute.__file__, rf_compute.__file__"
          python -m pytest -q -p no:cacheprovider tests
          python "$GITHUB_WORKSPACE/examples/tier1_aircomp_kernel.py"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
