name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (simulation-only deps)
        # We install without the [sdr] extra because SoapySDR is a system
        # library, not pip-installable in CI. The kernel degrades to
        # simulation, so the full suite runs on numpy + pytest alone.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run example smoke scripts
        # Confirm every example script (the ones a builder runs first)
        # executes without error — not just that the tests pass.
        shell: bash
        run: |
          for f in examples/*.py; do
            echo "== $f"
            python "$f"
          done